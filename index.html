<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Narciso Salvador | Frontend Software Engineer</title>
    <meta
      name="description"
      content="Frontend software engineer building UI for LLM and agentic AI products. 3.5 years at IBM on watsonx Orchestrate. React, TypeScript, TanStack."
    />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Link previews (LinkedIn, Slack, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://narcisosalvador.com/" />
    <meta property="og:title" content="Narciso Salvador | Frontend Software Engineer" />
    <meta
      property="og:description"
      content="Building UI for LLM and agentic AI products. Frontend engineer on IBM watsonx Orchestrate."
    />
    <meta property="og:image" content="https://narcisosalvador.com/headshot.webp" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Runs before the page paints so dark-mode visitors never see a white flash.
         Saved choice wins; otherwise follow the OS setting. -->
    <script>
      try {
        var saved = localStorage.getItem('theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
